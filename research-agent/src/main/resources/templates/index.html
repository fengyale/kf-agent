<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 调研助手</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #162032; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --faint: #64748b;
    --purple: #7c3aed; --purple-l: #a78bfa; --blue: #3b82f6; --green: #10b981;
    --red: #ef4444; --amber: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

  .app { display: flex; height: 100vh; }

  /* ===== 左侧会话栏 ===== */
  .side { width: 264px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .side .brand { padding: 16px 16px 12px; display: flex; align-items: center; gap: 10px; }
  .side .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #7c3aed, #4f46e5); display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .side .brand .t { font-weight: 700; font-size: 14px; color: var(--text); }
  .side .brand .s { font-size: 10px; color: var(--faint); }
  .new-btn { margin: 4px 14px 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(124,58,237,.5); background: rgba(124,58,237,.14); color: var(--purple-l); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 7px; justify-content: center; }
  .new-btn:hover { background: rgba(124,58,237,.25); }
  .conv-list { flex: 1; overflow-y: auto; padding: 2px 8px; }
  .conv-list .sec { font-size: 10px; color: var(--faint); letter-spacing: .08em; padding: 8px 8px 5px; }
  .conv-item { padding: 9px 10px; border-radius: 9px; cursor: pointer; margin-bottom: 2px; border: 1px solid transparent; position: relative; }
  .conv-item:hover { background: var(--panel2); }
  .conv-item.active { background: rgba(124,58,237,.13); border-color: rgba(124,58,237,.45); }
  .conv-item .t { font-size: 12.5px; color: var(--text); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-right: 18px; }
  .conv-item .m { font-size: 10.5px; color: var(--faint); margin-top: 3px; display: flex; gap: 8px; }
  .conv-item .del { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); display: none; width: 20px; height: 20px; border-radius: 6px; border: none; background: transparent; color: var(--faint); font-size: 11px; cursor: pointer; line-height: 20px; text-align: center; }
  .conv-item:hover .del { display: block; }
  .conv-item .del:hover { color: #fca5a5; background: rgba(239,68,68,.12); }
  .side .foot { border-top: 1px solid var(--border); padding: 10px 14px; }
  .side .foot a { display: flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-size: 12.5px; padding: 7px 10px; border-radius: 8px; }
  .side .foot a + a { margin-top: 4px; }
  .side .foot a:hover { background: var(--panel2); color: var(--text); }

  /* ===== 主区 ===== */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .main-head { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--panel); }
  .main-head .ct { font-size: 13px; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main-head .cm { font-size: 11px; color: var(--faint); white-space: nowrap; }

  .msgs { flex: 1; overflow-y: auto; padding: 28px 20px 10px; scroll-behavior: smooth; }
  .msgs-inner { max-width: 820px; margin: 0 auto; }

  /* 欢迎空状态 */
  .welcome { max-width: 640px; margin: 8vh auto 0; text-align: center; }
  .welcome .big-logo { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #7c3aed, #4f46e5); display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 16px; box-shadow: 0 8px 28px rgba(124,58,237,.35); }
  .welcome h1 { font-size: 22px; color: var(--text); margin-bottom: 8px; }
  .welcome .sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; line-height: 1.7; }
  .sugs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
  .sug { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px; cursor: pointer; transition: border-color .15s; }
  .sug:hover { border-color: var(--purple); }
  .sug .k { font-size: 12px; margin-bottom: 4px; }
  .sug .v { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  /* ===== 消息气泡 ===== */
  .msg { display: flex; gap: 10px; margin-bottom: 22px; }
  .msg .avatar { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; background: var(--panel2); border: 1px solid var(--border); }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: rgba(124,58,237,.2); border-color: rgba(124,58,237,.5); }
  .msg .body { max-width: 76%; min-width: 0; }
  .msg.user .body { background: linear-gradient(135deg, #6d28d9, #7c3aed); color: #f5f3ff; padding: 11px 15px; border-radius: 14px 4px 14px 14px; font-size: 14px; line-height: 1.7; word-break: break-word; white-space: pre-wrap; }
  .msg.assistant .body { flex: 1; }
  .md { font-size: 14px; line-height: 1.8; word-break: break-word; color: #dbe2ea; }
  .md p { margin: 6px 0; }
  .md h1,.md h2,.md h3 { margin: 12px 0 6px; color: var(--text); }
  .md h1 { font-size: 17px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; }
  .md ul,.md ol { padding-left: 22px; margin: 6px 0; }
  .md code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .md pre { background: #0b1220; border: 1px solid var(--border); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
  .md pre code { background: none; padding: 0; }
  .md strong { color: #fff; }
  .md a { color: var(--purple-l); }
  .md blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--muted); margin: 6px 0; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--purple-l); margin-left: 2px; vertical-align: -2px; animation: blink .8s infinite; border-radius: 1px; }
  @keyframes blink { 0%,60% { opacity: 1; } 61%,100% { opacity: 0; } }
  .thinking-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .thinking-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: tdots 1.2s infinite; }
  .thinking-dots i:nth-child(2) { animation-delay: .2s; } .thinking-dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes tdots { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }
  .intent-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--purple-l); background: rgba(124,58,237,.13); border: 1px solid rgba(124,58,237,.4); padding: 3px 9px; border-radius: 10px; margin-bottom: 8px; }
  .msg-error { color: #fca5a5; font-size: 13px; background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3); border-radius: 10px; padding: 9px 13px; }

  /* ===== 调研任务卡片 ===== */
  .task-card { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--purple); border-radius: 12px; padding: 14px 16px; min-width: 300px; }
  .task-card.running { border-left-color: var(--blue); }
  .task-card.done { border-left-color: var(--green); }
  .task-card.failed { border-left-color: var(--red); }
  .task-card.cancelled { border-left-color: var(--faint); }
  .tc-head { display: flex; align-items: flex-start; gap: 8px; }
  .tc-topic { flex: 1; min-width: 0; font-size: 13.5px; color: var(--text); font-weight: 600; line-height: 1.55; word-break: break-word; }
  .tc-status { font-size: 11px; padding: 3px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .tc-status.running { background: rgba(59,130,246,.15); color: #93c5fd; border-color: rgba(59,130,246,.4); animation: pulse 1.6s infinite; }
  .tc-status.done { background: rgba(16,185,129,.15); color: #6ee7b7; border-color: rgba(16,185,129,.4); }
  .tc-status.failed { background: rgba(239,68,68,.15); color: #fca5a5; border-color: rgba(239,68,68,.4); }
  .tc-status.cancelled { color: var(--faint); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .tc-progress { margin-top: 10px; font-size: 11.5px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .tc-bar { margin-top: 10px; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; }
  .tc-bar i { display: block; height: 100%; background: linear-gradient(90deg, #7c3aed, #3b82f6); border-radius: 2px; transition: width .5s; width: 0; animation: barSlide 2.2s infinite; }
  @keyframes barSlide { 0% { opacity: .7; } 50% { opacity: 1; } }
  .task-card.done .tc-bar i { animation: none; width: 100%; background: var(--green); }
  .task-card.failed .tc-bar i, .task-card.cancelled .tc-bar i { animation: none; background: var(--red); width: 100%; }
  .task-card.failed .tc-bar i { background: var(--red); } .task-card.cancelled .tc-bar i { background: var(--faint); }
  .tc-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tc-btn { font-size: 11.5px; padding: 5px 13px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--purple-l); cursor: pointer; text-decoration: none; }
  .tc-btn:hover { border-color: var(--purple); background: rgba(124,58,237,.1); }
  .tc-btn.primary { background: var(--purple); border-color: var(--purple); color: #fff; }
  .tc-btn.primary:hover { background: #6d28d9; }

  /* ===== 底部输入区 ===== */
  .input-wrap { padding: 10px 20px 18px; background: linear-gradient(transparent, var(--bg) 30%); }
  .input-box { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px 10px; transition: border-color .15s; }
  .input-box:focus-within { border-color: var(--purple); }
  .input-box textarea { width: 100%; background: transparent; border: none; outline: none; resize: none; color: var(--text); font-size: 14px; font-family: inherit; line-height: 1.6; max-height: 160px; min-height: 24px; }
  .input-box textarea::placeholder { color: var(--faint); }
  .input-box .row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .input-box .hint { font-size: 11px; color: var(--faint); }
  .send-btn { width: 34px; height: 34px; border-radius: 10px; border: none; background: var(--purple); color: #fff; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .send-btn:disabled { opacity: .35; cursor: not-allowed; }
  .send-btn:not(:disabled):hover { background: #6d28d9; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 720px) {
    .side { display: none; }
    .sugs { grid-template-columns: 1fr; }
    .msg .body { max-width: 88%; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="brand">
      <div class="logo">🔍</div>
      <div><div class="t">AI 调研助手</div><div class="s">深度搜索 · 引用报告</div></div>
    </div>
    <button class="new-btn" id="btn-new">＋ 新对话</button>
    <div class="conv-list" id="conv-list"></div>
    <div class="foot">
      <a href="/monitor">🔍 工作流监控</a>
      <a href="/tasks">📊 调研数据与统计</a>
    </div>
  </div>

  <div class="main">
    <div class="main-head">
      <span class="ct" id="conv-title">新对话</span>
      <span class="cm" id="conv-meta"></span>
    </div>

    <div class="msgs" id="msgs">
      <div class="msgs-inner" id="msgs-inner"></div>
    </div>

    <div class="input-wrap">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="输入消息或调研主题，例如：调研 2026 年 MCP 协议在企业 Agent 落地中的现状"></textarea>
        <div class="row">
          <span class="hint">Enter 发送 · Shift+Enter 换行 · 调研主题将自动启动深度搜索任务</span>
          <button class="send-btn" id="btn-send" title="发送">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/chat.js}"></script>
</body>
</html>
