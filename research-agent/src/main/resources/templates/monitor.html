<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作流监控 · AI 调研 Agent</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #162032; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --faint: #64748b;
    --purple: #7c3aed; --purple-l: #a78bfa; --blue: #3b82f6; --green: #10b981;
    --red: #ef4444; --amber: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }

  /* ===== 顶栏 ===== */
  .topbar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 16px; position: sticky; top: 0; z-index: 50; }
  .topbar-row1 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .back { color: var(--purple-l); text-decoration: none; font-size: 13px; white-space: nowrap; }
  .brand { font-weight: 700; font-size: 15px; color: var(--purple-l); white-space: nowrap; }
  .brand-sub { font-size: 11px; color: var(--faint); }
  .task-title { font-size: 13px; color: var(--text); flex: 1; min-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctrl-btn { font-size: 12px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); cursor: pointer; white-space: nowrap; }
  .ctrl-btn:hover { border-color: var(--purple); }
  .ctrl-btn.danger { color: #fca5a5; border-color: #7f1d1d; }
  .ctrl-btn:disabled { opacity: .4; cursor: not-allowed; }
  .view-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .view-switch button { font-size: 12px; padding: 5px 14px; border: none; background: transparent; color: var(--muted); cursor: pointer; }
  .view-switch button.active { background: var(--purple); color: #fff; }

  .topbar-row2 { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .chip { font-size: 11px; padding: 3px 10px; border-radius: 10px; background: var(--panel2); color: var(--muted); border: 1px solid var(--border); }
  .chip.running { background: rgba(59,130,246,.15); color: #93c5fd; border-color: rgba(59,130,246,.4); animation: pulse 1.6s infinite; }
  .chip.done { background: rgba(16,185,129,.15); color: #6ee7b7; border-color: rgba(16,185,129,.4); }
  .chip.failed { background: rgba(239,68,68,.15); color: #fca5a5; border-color: rgba(239,68,68,.4); }
  .chip.warn { background: rgba(245,158,11,.15); color: #fcd34d; border-color: rgba(245,158,11,.4); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* ===== 三栏布局 ===== */
  .layout { display: flex; gap: 12px; padding: 12px 16px; align-items: stretch; min-height: calc(100vh - 110px); }
  .task-panel { width: 240px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; max-height: 78vh; }
  .task-panel .head { padding: 12px 14px 8px; }
  .task-panel .head h3 { font-size: 13px; color: var(--text); margin-bottom: 8px; }
  .filter-tabs { display: flex; gap: 6px; }
  .filter-tabs button { font-size: 11px; padding: 3px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
  .filter-tabs button.active { background: rgba(124,58,237,.2); color: var(--purple-l); border-color: var(--purple); }
  .task-list { overflow-y: auto; flex: 1; padding: 6px; }
  .task-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; }
  .task-item:hover { background: var(--panel2); }
  .task-item.current { border-color: var(--blue); background: rgba(59,130,246,.08); }
  .task-item .t { font-size: 12px; color: var(--text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .task-item .s { font-size: 11px; margin-top: 3px; display: flex; align-items: center; gap: 5px; color: var(--faint); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.running { background: var(--blue); animation: pulse 1.4s infinite; }
  .dot.done { background: var(--green); }
  .dot.failed { background: var(--red); }
  .dot.cancelled { background: var(--faint); }

  .canvas-panel { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; position: relative; overflow: auto;
    background-image: radial-gradient(circle, rgba(148,163,184,.14) 1px, transparent 1px); background-size: 22px 22px; }
  #canvas { display: block; }
  .canvas-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 13px; }

  /* ===== 策略与筛选视图 ===== */
  .strategy-view { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; overflow-y: auto; max-height: 78vh; }
  .sv-round { margin-bottom: 14px; }
  .sv-round h4 { font-size: 13px; color: var(--purple-l); margin-bottom: 8px; }
  table.sv { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.sv th { text-align: left; color: var(--muted); font-weight: 500; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  table.sv td { padding: 6px 8px; border-bottom: 1px solid var(--panel2); color: var(--text); vertical-align: top; }
  table.sv td.muted { color: var(--muted); }
  .pill { font-size: 10px; padding: 1px 7px; border-radius: 6px; background: rgba(124,58,237,.18); color: var(--purple-l); }
  .pill.warn { background: rgba(245,158,11,.15); color: #fcd34d; }
  .pill.zero { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ===== 右侧详情 ===== */
  .detail-panel { width: 350px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; overflow-y: auto; max-height: 78vh; }
  .detail-panel h3 { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .detail-panel .sub { font-size: 11px; color: var(--faint); margin: 2px 0 12px; }
  .placeholder { color: var(--faint); font-size: 12px; text-align: center; padding: 60px 0; }
  .info-card { background: var(--panel2); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 12px; }
  .info-card .row { display: flex; justify-content: space-between; padding: 3px 0; }
  .info-card .k { color: var(--faint); }
  .info-card .v { color: var(--text); font-weight: 600; text-align: right; }
  .sec-label { font-size: 10px; letter-spacing: .08em; color: var(--purple-l); font-weight: 700; margin: 12px 0 6px; }
  .codeblock { background: #0b1220; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: Consolas, "Courier New", monospace; font-size: 11px; color: #cbd5e1; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; line-height: 1.6; }
  .codeblock .jk { color: #93c5fd; } .codeblock .js { color: #fbbf24; } .codeblock .jn { color: #a78bfa; }
  .detail-err { color: #fca5a5; font-size: 12px; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .fold { cursor: pointer; user-select: none; font-size: 11px; color: var(--muted); }
  .fold-body { display: none; margin-top: 6px; }
  .fold.open .fold-body { display: block; }
  .fold .arr { display: inline-block; transition: transform .15s; margin-right: 4px; }
  .fold:not(.open) .arr { transform: rotate(-90deg); }

  /* ===== 报告区（深色） ===== */
  .report-card { margin: 0 16px 24px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; }
  .report-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .report-head h2 { font-size: 15px; color: var(--text); }
  .report-tools { display: flex; gap: 8px; align-items: center; }
  .report-status { font-size: 12px; color: var(--muted); }
  .dl-btn { font-size: 11px; padding: 3px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--purple-l); cursor: pointer; text-decoration: none; }
  .dl-btn:hover { border-color: var(--purple); }
  .cursor { display: inline-block; width: 7px; height: 14px; background: var(--purple-l); margin-left: 2px; vertical-align: -2px; animation: blink .8s infinite; border-radius: 1px; }
  @keyframes blink { 0%,60% { opacity: 1; } 61%,100% { opacity: 0; } }

  .think { border-left: 3px solid var(--border); margin-bottom: 12px; font-size: 12px; color: var(--muted); }
  .think .tlabel { cursor: pointer; user-select: none; color: var(--muted); font-size: 12px; padding: 2px 0; }
  .think .tbody { white-space: pre-wrap; word-break: break-word; padding: 6px 0 6px 10px; max-height: 260px; overflow-y: auto; display: none; font-size: 12px; }
  .think.open .tbody { display: block; }
  .think .arrow { display: inline-block; transition: transform .15s; margin-right: 4px; }
  .think:not(.open) .arrow { transform: rotate(-90deg); }

  #issues { margin-bottom: 14px; }
  #issues h4 { font-size: 13px; color: #fcd34d; margin-bottom: 8px; }
  .issue { font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.3); color: var(--text); }
  .issue .tag { display: inline-block; font-size: 10px; border-radius: 6px; padding: 1px 6px; margin-right: 8px; color: #0f172a; font-weight: 700; }
  .issue .tag.a { background: var(--amber); }
  .issue .tag.b { background: #fb923c; }
  .issue .sec { color: var(--amber); font-size: 11px; margin-left: 6px; }

  #report { font-size: 13px; line-height: 1.85; word-break: break-word; color: #dbe2ea; }
  #report h1 { font-size: 19px; margin: 14px 0 10px; color: var(--text); }
  #report h2 { font-size: 16px; margin: 16px 0 8px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  #report h3 { font-size: 14px; margin: 12px 0 6px; color: var(--text); }
  #report p { margin: 6px 0; }
  #report ul, #report ol { padding-left: 22px; margin: 6px 0; }
  #report code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  #report pre { background: #0b1220; padding: 8px 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
  #report pre code { background: none; padding: 0; }
  #report strong { font-weight: 600; color: #fff; }
  #report blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--muted); margin: 8px 0; font-size: 12px; }
  #report .cite { color: var(--purple-l); text-decoration: none; font-size: 11px; vertical-align: super; margin: 0 1px; }

  /* ===== SVG 节点（深色卡片） ===== */
  .node rect.box { fill: #1e293b; stroke: #334155; stroke-width: 1.2; rx: 10; }
  .node text { fill: #cbd5e1; font-size: 12px; font-family: inherit; }
  .node text.sub { font-size: 10px; fill: #94a3b8; }
  .node.pending rect.box { fill: #1e293b; }
  .node.running rect.box { fill: rgba(59,130,246,.12); stroke: #3b82f6; animation: nodePulse 1.4s infinite; }
  .node.running text { fill: #93c5fd; }
  .node.done rect.box { fill: rgba(16,185,129,.08); stroke: rgba(16,185,129,.55); }
  .node.done text { fill: #6ee7b7; }
  .node.error rect.box { fill: rgba(239,68,68,.1); stroke: rgba(239,68,68,.6); }
  .node.error text { fill: #fca5a5; }
  .node.review rect.box { fill: rgba(245,158,11,.1); stroke: rgba(245,158,11,.6); animation: nodePulse 1s infinite; }
  .node.review text { fill: #fcd34d; }
  @keyframes nodePulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
  .node { cursor: pointer; }
  .node.selected rect.box { stroke: #a78bfa; stroke-width: 2.2; }
  .node .num-badge rect { fill: #7c3aed; stroke: none; }
  .node.running .num-badge rect { fill: #3b82f6; }
  .node.done .num-badge rect { fill: #059669; }
  .node.error .num-badge rect { fill: #dc2626; }
  .node.review .num-badge rect { fill: #d97706; }
  .node .num-badge text { fill: #fff; font-size: 9px; font-weight: 700; }
  .node .kind-tag rect { fill: rgba(124,58,237,.18); stroke: rgba(124,58,237,.5); }
  .node .kind-tag text { fill: #c4b5fd; font-size: 8.5px; }
  .node .st-bar { stroke: none; }
  .node.running .st-bar { fill: #3b82f6; }
  .node.done .st-bar { fill: #10b981; }
  .node.error .st-bar { fill: #ef4444; }
  .node.review .st-bar { fill: #f59e0b; }

  .edge { stroke: #334155; stroke-width: 1.6; fill: none; }
  .edge.flow { stroke: #7c3aed; stroke-dasharray: 7 5; animation: edgeFlow .7s linear infinite; }
  @keyframes edgeFlow { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }

  .badge rect { fill: rgba(148,163,184,.15); stroke: #475569; }
  .badge text { font-size: 9px; fill: #94a3b8; }
  .badge.done rect { fill: rgba(16,185,129,.15); stroke: rgba(16,185,129,.5); }
  .badge.done text { fill: #6ee7b7; }
  .badge.error rect { fill: rgba(239,68,68,.15); stroke: rgba(239,68,68,.5); }
  .badge.error text { fill: #fca5a5; }
  .badge.warn rect { fill: rgba(245,158,11,.15); stroke: rgba(245,158,11,.5); }
  .badge.warn text { fill: #fcd34d; }

  .lane-label { font-size: 11px; fill: #64748b; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-row1">
    <a class="back" href="/">← 返回</a>
    <span class="brand">🔍 工作流监控</span>
    <span class="task-title" id="topic">加载中…</span>
    <div class="view-switch" id="view-switch">
      <button data-view="flow" class="active">流程图</button>
      <button data-view="strategy">策略与筛选</button>
    </div>
    <button class="ctrl-btn" id="btn-refresh">刷新</button>
    <button class="ctrl-btn" id="btn-pause" style="display:none">⏸ 暂停</button>
    <button class="ctrl-btn" id="btn-resume" style="display:none">▶ 继续</button>
    <button class="ctrl-btn danger" id="btn-cancel" style="display:none">✕ 终止</button>
  </div>
  <div class="topbar-row2">
    <span class="chip" id="taskId"></span>
    <span class="chip running" id="status">连接中…</span>
    <span class="chip" id="budget" style="display:none"></span>
    <span class="chip" id="exit" style="display:none"></span>
  </div>
</div>

<div class="layout">
  <div class="task-panel">
    <div class="head">
      <h3>调研任务</h3>
      <div class="filter-tabs" id="filter-tabs">
        <button data-f="all" class="active">全部</button>
        <button data-f="running">进行中</button>
        <button data-f="done">已完成</button>
      </div>
    </div>
    <div class="task-list" id="task-list"><div class="placeholder">加载中…</div></div>
  </div>

  <div class="canvas-panel" id="flow-view">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="canvas-empty" id="canvas-empty">等待事件流…</div>
  </div>

  <div class="strategy-view" id="strategy-view" style="display:none"></div>

  <div class="detail-panel">
    <h3>⚙ 节点详情</h3>
    <div class="sub">输入、提示词、输出与执行说明</div>
    <div class="placeholder" id="detail-placeholder">点击画布节点查看详情</div>
    <div id="detail" style="display:none"></div>
  </div>
</div>

<div class="report-card">
  <div class="report-head">
    <h2>📝 调研报告</h2>
    <div class="report-tools">
      <span class="report-status" id="report-status">等待生成…</span>
      <a class="dl-btn" id="dl-btn" style="display:none" href="#" download>⬇ 下载报告</a>
    </div>
  </div>
  <div class="think" id="think" style="display:none">
    <div class="tlabel"><span class="arrow">▾</span><span id="think-label">思考中…</span></div>
    <div class="tbody" id="think-body"></div>
  </div>
  <div id="issues"></div>
  <div id="report"></div>
</div>

<script th:inline="javascript">window.__TASK_ID__ = [[${taskId}]];</script>
<script th:src="@{/js/monitor.js}"></script>
</body>
</html>
