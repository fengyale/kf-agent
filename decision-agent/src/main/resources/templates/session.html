<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分析会话 · 决策参谋</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <style>
    /* 对话流条目间距（Tailwind 管布局，这里只管流式列表节拍） */
    #flow > * + * { margin-top: 14px; }
  </style>
</head>
<body class="theme-paper" th:attr="data-analysis-id=${analysisId}">
<div class="flex flex-col h-screen">

  <!-- ======== 顶栏：问题 + 状态 + SSE 连接指示 ======== -->
  <header class="px-4 md:px-6 py-3 border-b flex-shrink-0"
          style="border-color: var(--border); background: var(--panel);">
    <div class="max-w-3xl mx-auto flex items-center gap-3">
      <a href="/" class="brand-mark" style="width:32px;height:32px;font-size:15px;" title="返回首页">决</a>
      <div class="flex-1 min-w-0">
        <div class="text-xs" style="color: var(--faint);">分析会话</div>
        <div id="q-title" class="text-sm truncate" style="color: var(--ink); font-weight: 600;">加载中…</div>
      </div>
      <span id="status-chip" class="chip chip-faint">加载中</span>
      <a href="/stats" class="btn-ghost btn-sm hidden md:inline-flex flex-shrink-0" title="统计页 · 调用明细">统计</a>
      <a href="/behavior" class="btn-ghost btn-sm hidden md:inline-flex flex-shrink-0" title="行为数据 · 分桶校准">行为数据</a>
      <div class="flex items-center gap-1.5 flex-shrink-0" title="SSE 实时连接状态">
        <span id="conn-dot" class="conn-dot connecting"></span>
        <span id="conn-text" class="text-xs hidden md:inline" style="color: var(--faint); min-width: 40px;">连接中</span>
      </div>
    </div>
  </header>

  <!-- ======== 阶段指示器：意图/采集/评估/路径/差距/风险 ======== -->
  <div class="px-4 md:px-6 py-3.5 border-b flex-shrink-0" style="border-color: var(--border-soft); background: var(--paper-soft);">
    <div id="stage-bar" class="stage-bar max-w-3xl mx-auto"></div>
  </div>

  <!-- ======== 思考流（可折叠，analysis:thinking 到达后显示） ======== -->
  <div id="think-wrap" class="px-4 md:px-6 pt-3 flex-shrink-0 hidden">
    <div id="think-panel" class="think-panel max-w-3xl mx-auto open">
      <div class="think-head" id="think-head">
        <span class="caret">▶</span><span>思考流</span>
        <span class="ml-auto" style="color: var(--faint);">模型推理过程 · 仅供参考</span>
      </div>
      <div class="think-body" id="think-body"></div>
    </div>
  </div>

  <!-- ======== 采集对话流 ======== -->
  <main id="flow-scroll" class="flex-1 overflow-y-auto px-4 md:px-6 py-5">
    <div id="flow" class="max-w-3xl mx-auto pb-4"></div>
  </main>
</div>

<script th:src="@{/js/sse.js}"></script>
<script th:src="@{/js/session.js}"></script>
</body>
</html>
